services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: battle_arena_app
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=battle_arena
      - DB_USERNAME=battle_arena
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    container_name: battle_arena_web
    ports:
      - "${WEB_PORT_MAPPING:-127.0.0.1:8092:80}"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: battle_arena_db
    ports:
      - "${DB_PORT_MAPPING:-127.0.0.1:5441:5432}"
    environment:
      - POSTGRES_DB=battle_arena
      - POSTGRES_USER=battle_arena
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - battle_arena_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battle_arena -d battle_arena"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  battle_arena_db_data:
